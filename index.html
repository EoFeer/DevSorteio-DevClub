<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSorteio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="./img/DevSorteio.png" class="logo-img" alt="given-the-draw" />
    <div class="box-draw">
      <h2>Sortear um número</h2>
      <div class="box-input">
        <input class="input-min" placeholder="entre" type="number" />
        <input class="input-max" placeholder="e" type="number" />
      </div>

      <button class="draw-button" onclick="randomNumber()">Sortear</button>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
